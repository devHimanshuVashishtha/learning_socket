<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
        body {
            margin: 0;
            padding-bottom: 3rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #form {
            background: rgba(0, 0, 0, 0.15);
            padding: 0.25rem;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            height: 3rem;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        #input {
            border: none;
            padding: 0 1rem;
            flex-grow: 1;
            border-radius: 2rem;
            margin: 0.25rem;
        }

        #input:focus {
            outline: none;
        }

        #form>button {
            background: #333;
            border: none;
            padding: 0 1rem;
            margin: 0.25rem;
            border-radius: 3px;
            outline: none;
            color: #fff;
        }

        #messages {
            list-style-type: none;
            margin: 0;
            padding: 0;
            bottom: 0;
        }

        #messages>li {
            padding: 0.5rem 1rem;
        }

        #messages>li:nth-child(odd) {
            background: #efefef;
        }
    </style>
</head>

<body>
    <ul id="messages"></ul>
    <form id="form" action="">
        <input id="input" autocomplete="off" placeholder="Type your messages....." />
        <button id="btn" type="submit">Send</button>
        <button id="disconnect-btn" type="button">Disconnect</button>
    </form>
</body>
<script src="/socket.io/socket.io.js"></script>
<script>

    let counter = 0;
    const socket = io({
        auth: {
            serverOffset: 0
        },
        ackTimeout: 1000,
        retiries: 3,
    });

    socket.on('connect_error', (err) => {
        const item = document.createElement('li');
        item.textContent = `Connection failed: ${err.message}.`;
        messages.appendChild(item);
    });

    socket.on('error message', (error) => {
        const item = document.createElement('li');
        item.textContent = `Error: ${error}`;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
    });


    const form = document.getElementById('form')
    const inputdata = document.getElementById('input')
    const messages = document.getElementById('messages')
    const btn = document.getElementById('btn')
    const Disconnectbtn = document.getElementById('disconnect-btn')
    socket.on('connect', () => {
        console.log("connection stablish")
    })
    socket.on("disconnect", (resa) => {
        console.log("message of client-error:", resa)
        const item = document.createElement('li');
        item.textContent = `you disconnected. Reason: ${resa}`;
        messages.appendChild(item);
    })


    Disconnectbtn.textContent = 'Disconnect';
    Disconnectbtn.addEventListener('click', (e) => {
        if (socket.connected) {
            Disconnectbtn.innerText = 'connect'
            socket.disconnect();
        }
        else {
            Disconnectbtn.innerText = 'Disconnect'
            socket.connect();

        }
    })

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const msg = inputdata.value.trim()
        if (msg) {
            const clientOffset = `${socket.id} - ${counter++}`
            socket.emit("chat msg", msg, clientOffset, (acknowledgedOffset, err) => {
                if (err) {
                    console.log('server failed to run the callback')
                    return
                }
                console.log(`ackoffset:${acknowledgedOffset}, clientOffset:${clientOffset}`)
            })
            inputdata.value = ""
        }
    })

    socket.on('chat msg', (msg, serverOffset) => {
        const item = document.createElement('li');
        item.textContent = `${msg.username}: ${msg.content}`;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
        socket.auth.serverOffset = serverOffset
    })
</script>

</html>
